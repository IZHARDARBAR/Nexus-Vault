<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="cyberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Cyber Shield -->
  <rect width="100" height="100" rx="26" fill="#090a0f" />
  <rect x="2" y="2" width="96" height="96" rx="24" fill="url(#cyberGrad)" fill-opacity="0.15" stroke="url(#cyberGrad)" stroke-width="3" />

  <!-- App Cyberpunk CPU Core Logo -->
  <g transform="translate(25, 25) scale(2)" filter="url(#glow)">
    <!-- Circuit Pins -->
    <path d="M4 9h-2.5M4 15h-2.5M20 9h2.5M20 15h2.5M9 4V1.5M15 4V1.5M9 20v2.5M15 20v2.5" stroke="#22d3ee" stroke-width="1.8" stroke-linecap="round" />
    <!-- Chip Shield -->
    <rect x="4" y="4" width="16" height="16" rx="3.5" fill="#08090e" stroke="url(#cyberGrad)" stroke-width="1.8" />
    <!-- Glowing Quantum Core -->
    <rect x="8.5" y="8.5" width="7" height="7" rx="1.5" fill="#22d3ee" />
  </g>
</svg>